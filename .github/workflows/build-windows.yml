name: Build Anime Downloader (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: pyinstaller AnimePaheDL.spec --noconfirm
      - name: Smoke test CLI in the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AnimePaheDL\AnimePaheDL.exe -ArgumentList "cli","--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe failed with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: AnimePaheDL-windows-x64
          path: dist/AnimePaheDL
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist\AnimePaheDL\* -DestinationPath AnimePaheDL-windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" AnimePaheDL-windows-x64.zip --title "Anime Downloader ${{ github.ref_name }}" --generate-notes
